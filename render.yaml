services:
  - type: web
    name: can-logger-dashboard
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DASHBOARD_MODE
        value: cloud
      - key: DEVICE_NAME
        value: Family Vehicle
      - key: DEVICE_UPLOAD_TOKEN
        sync: false
      - key: DASHBOARD_AUTH_EMAIL
        value: customer@example.com
      - key: DASHBOARD_AUTH_PASSWORD
        sync: false
      - key: CUSTOMER_ID
        value: CANLOGGER-001
      - key: DATABASE_URL
        sync: false
